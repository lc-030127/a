name: Build PerfDogLite APK
on: push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Accept licenses & install SDK
        run: |
          yes | sdkmanager --licenses --sdk_root=$ANDROID_HOME || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" --sdk_root=$ANDROID_HOME
      - name: Install Gradle 8.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          echo "$PWD/gradle-8.9/bin" >> $GITHUB_PATH
      - name: Materialize project
        run: bash make.sh
      - name: Build debug APK
        run: |
          cd PerfDogLite
          gradle assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: perfdog-lite-apk
          path: PerfDogLite/app/build/outputs/apk/debug/app-debug.apk
